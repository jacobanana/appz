<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wave Calculator</title>
<meta name="description" content="Tempo calculators on one shared BPM: compressor attack and release, note lengths, delay and reverb times, MIDI clock ticks, bars to time, and tempo changes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231D2125'/><path d='M4 8 L10 8 Q12 22 16 22 Q20 22 22 8 L28 8' fill='none' stroke='%23F0A52B' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Phones have no console: show the first script error on the page instead.
  addEventListener('error', (e) => {
    if (document.querySelector('.oops') || !e.message) return;
    const p = document.createElement('p');
    p.className = 'oops';
    p.setAttribute('role', 'alert');
    p.textContent = 'Something went wrong (' + e.message + (e.filename ? ', ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '). Reloading usually fixes it.';
    (document.querySelector('main') || document.body).prepend(p);
  });
</script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><a href="../" class="home" aria-label="Back to appz">appz</a><span class="sep">/</span><h1>Wave Calculator</h1></div>

    <div class="tempo" role="group" aria-label="Tempo, shared by every calculator">
      <div class="bpm">
        <button type="button" id="bpmDown" class="step" aria-label="One BPM slower (shift: 0.1)">−</button>
        <label class="bpm-field">
          <span class="visually-hidden">Tempo in BPM</span>
          <input id="bpm" type="number" step="0.001" inputmode="decimal" autocomplete="off">
          <span class="bpm-unit" aria-hidden="true">BPM</span>
        </label>
        <button type="button" id="bpmUp" class="step" aria-label="One BPM faster (shift: 0.1)">+</button>
      </div>
      <div class="tools">
        <button type="button" id="half" class="tool" aria-label="Half time">÷2</button>
        <button type="button" id="double" class="tool" aria-label="Double time">×2</button>
        <button type="button" id="tap" class="tool tap" title="Tap along, or press T">Tap</button>
      </div>
      <div class="context">
        <label class="ctx">Time <span class="sig"><select id="sigNum" aria-label="Beats per bar"></select><span aria-hidden="true">/</span><select id="sigDen" aria-label="Beat value"></select></span></label>
        <label class="ctx">Rate <select id="rate" aria-label="Sample rate"></select></label>
      </div>
    </div>
  </div>
  <nav class="appbar" id="appbar" aria-label="Calculator" hidden>
    <a href="#" class="apps-btn" aria-label="All calculators"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.75" y="2.75" width="5.5" height="5.5" rx="1.5"/><rect x="11.75" y="2.75" width="5.5" height="5.5" rx="1.5"/><rect x="2.75" y="11.75" width="5.5" height="5.5" rx="1.5"/><rect x="11.75" y="11.75" width="5.5" height="5.5" rx="1.5"/></g></svg><span>Apps</span></a>
    <span class="app-current"><span id="appIcon"></span><span id="appTitle"></span></span>
  </nav>
</header>

<main>
  <section id="home" class="home" aria-label="Calculators"></section>
  <div id="modes"></div>
</main>

<!-- Core first, then one file per mode (icon order = script order), then the shell. -->
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/modes/compressor.js"></script>
<script src="js/modes/notes.js"></script>
<script src="js/modes/delay.js"></script>
<script src="js/modes/reverb.js"></script>
<script src="js/modes/midi-clock.js"></script>
<script src="js/modes/bars.js"></script>
<script src="js/modes/retempo.js"></script>
<script src="js/app.js"></script>
</body>
</html>

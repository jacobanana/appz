name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Pages lets browsers cache files for 10 minutes, so right after a deploy a
      # new index.html could run last deploy's scripts. Stamp every local
      # .js/.css reference with this commit so each page gets its own files.
      - name: Version asset links
        run: |
          export V="${GITHUB_SHA::7}"
          find . -name '*.html' -not -path './.git/*' -print0 |
            xargs -0 perl -pi -e 's/((?:src|href)="(?![a-z]+:|\/\/)[^"?#]+\.(?:js|css))"/$1?v=$ENV{V}"/g'

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The repo root is the site: index.html plus one folder per app.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
